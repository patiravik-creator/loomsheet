name: Site regression tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "backend/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "backend/**"
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Cache Tesseract language data
        uses: actions/cache@v4
        with:
          path: tests/vendor/tesseract/eng.traineddata.gz
          key: tessdata-eng-4.0.0

      - name: Prepare local Tesseract files for the OCR test
        run: node prepare-tesseract.js

      - name: Serve the site
        run: |
          python3 -m http.server 8899 --bind 127.0.0.1 --directory .. > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8899/index.html > /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8899/index.html > /dev/null

      - name: Run regression suite
        run: node regression.js

      - name: Run output checks
        if: always()
        run: node output-checks.js

      - name: Check per-tool pages
        if: always()
        run: node tool-pages.js

      - name: Verify generated tool pages are up to date
        if: always()
        run: |
          node ../scripts/build-pages.js --base http://127.0.0.1:8899/
          if [ -n "$(git -C .. status --porcelain -- . ':!tests')" ]; then
            echo "scripts/build-pages.js produced changes that aren't committed. Run it locally and commit the result:"
            git -C .. status --short -- . ':!tests'
            exit 1
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: |
            tests/results.json
            tests/server.log
          if-no-files-found: ignore
